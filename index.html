<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="manifest" href="manifest.webmanifest"><title>JOKER IPTV</title><style>
:root{--bg:#050505;--panel:#121212;--card:#181818;--text:#f7f7f7;--muted:#9a9a9a;--line:#292929;--accent:#fff}*{box-sizing:border-box}body.light{--bg:#f4f4f4;--panel:#fff;--card:#e9e9e9;--text:#101010;--muted:#666;--line:#d6d6d6;--accent:#111}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,Arial,sans-serif;transition:background .2s,color .2s}button,input{font:inherit}button{cursor:pointer;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px}button:active{transform:scale(.98)}.top{position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px}.brand b{font-size:19px;letter-spacing:1.5px}.spacer{flex:1}.iconbtn{padding:10px;min-width:42px}.wrap{padding:16px;max-width:900px;margin:auto}.hero{padding:18px 0 22px}.hero h1{font-size:clamp(28px,7vw,44px);margin:0 0 6px}.hero p{color:var(--muted);margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.primary{background:var(--text);color:var(--bg);font-weight:700;border-color:transparent}.search{width:100%;padding:14px 15px;border-radius:14px;background:var(--panel);color:var(--text);border:1px solid var(--line);outline:none;margin:6px 0 14px}.tabs{display:flex;gap:8px;margin:6px 0 14px}.tab.active{border-color:var(--text);font-weight:700}.list{display:grid;gap:9px}.channel{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px}.channel img{width:44px;height:44px;object-fit:contain;background:var(--card);border-radius:10px}.chinfo{flex:1;min-width:0}.chinfo strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chinfo small{color:var(--muted)}.fav{font-size:20px;padding:8px 10px;background:transparent;border:0}.empty{padding:30px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:100%;max-width:600px;background:var(--panel);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));color:var(--text)}.sheet h2{margin:0 0 14px}.sheet input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:8px 0}.sheet .row{display:flex;gap:10px;margin-top:12px}.sheet .row button{flex:1}.videoModal{align-items:center}.videoBox{width:100%;background:#000;max-width:900px;padding:12px}.videoBox video{width:100%;max-height:70vh;background:#000}.videoBox button{margin-top:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:99px;z-index:20;display:none;max-width:90%;text-align:center}.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:12px} @media(min-width:650px){.modal{align-items:center}.sheet{border-radius:22px}}
</style></head><body><header class="top"><div class="brand"><img src="logo.jpg" alt="JOKER original logo"><b>JOKER IPTV</b></div><div class="spacer"></div><button class="iconbtn" id="theme" aria-label="Toggle theme">☼</button><button class="iconbtn" id="addTop" aria-label="Add playlist">＋</button></header><main class="wrap"><section class="hero"><h1>Live TV</h1><p>Your channels, all in one place.</p><div class="actions"><button class="primary" id="add">＋ Add Playlist</button><button id="reload">↻ Reload</button></div></section><input class="search" id="search" placeholder="Search channels…" autocomplete="off"><div class="tabs"><button class="tab active" data-tab="all">All Channels</button><button class="tab" data-tab="favorites">Favorites</button></div><section class="list" id="channels"></section><div class="foot">JOKER IPTV · Personal player · Add your own playlist</div></main>
<div class="modal" id="addModal"><div class="sheet"><h2>Add Playlist</h2><input id="playlistName" placeholder="Playlist name (optional)"><input id="playlistUrl" placeholder="Paste M3U playlist URL" inputmode="url"><div class="row"><button id="cancel">Cancel</button><button class="primary" id="save">Load Playlist</button></div></div></div>
<div class="modal videoModal" id="videoModal"><div class="videoBox"><video id="video" controls playsinline></video><button id="closeVideo">Close Player</button></div></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';var channels=[],favorites={},activeTab='all',theme=localStorage.getItem('jokerTheme')||'dark',savedUrl=localStorage.getItem('jokerPlaylistUrl')||'',savedName=localStorage.getItem('jokerPlaylistName')||'';var $=function(id){return document.getElementById(id)};function setTheme(){document.body.classList.toggle('light',theme==='light');$('theme').textContent=theme==='light'?'☾':'☼';try{localStorage.setItem('jokerTheme',theme)}catch(e){}}setTheme();function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(function(){$('toast').style.display='none'},2600)}function showModal(id){$(id).classList.add('show')}function hideModal(id){$(id).classList.remove('show')}
function parseM3U(txt){var lines=txt.split(/\r?\n/),out=[],meta=null;for(var i=0;i<lines.length;i++){var l=lines[i].trim();if(!l)continue;if(l.indexOf('#EXTINF:')===0){meta={name:l.substring(l.indexOf(',')+1).trim()||'Unnamed channel',logo:(l.match(/tvg-logo="([^"]*)"/i)||[])[1]||'',group:(l.match(/group-title="([^"]*)"/i)||[])[1]||''};}else if(l.indexOf('#')!==0&&meta){out.push({name:meta.name,url:l,logo:meta.logo,group:meta.group});meta=null}}return out}
function render(){var query=$('search').value.toLowerCase().trim(),items=channels.filter(function(c){return(activeTab!=='favorites'||favorites[c.url])&&(!query||c.name.toLowerCase().indexOf(query)>=0||c.group.toLowerCase().indexOf(query)>=0)});var root=$('channels');root.innerHTML='';if(!items.length){root.innerHTML='<div class="empty">'+(channels.length?'No matching channels.':'Add an M3U playlist to get started.')+'</div>';return}items.forEach(function(c){var card=document.createElement('article');card.className='channel';var img=document.createElement('img');img.alt='';img.src=c.logo||'';img.onerror=function(){this.style.display='none'};var info=document.createElement('div');info.className='chinfo';var strong=document.createElement('strong');strong.textContent=c.name;var small=document.createElement('small');small.textContent=c.group||'Live channel';info.appendChild(strong);info.appendChild(small);var play=document.createElement('button');play.textContent='▶';play.setAttribute('aria-label','Play '+c.name);play.onclick=function(){playChannel(c)};var fav=document.createElement('button');fav.className='fav';fav.textContent=favorites[c.url]?'★':'☆';fav.onclick=function(){favorites[c.url]=!favorites[c.url];try{localStorage.setItem('jokerFavorites',JSON.stringify(favorites))}catch(e){}render()};card.appendChild(img);card.appendChild(info);card.appendChild(play);card.appendChild(fav);root.appendChild(card)})}
function playChannel(c){$('video').src=c.url;showModal('videoModal');var p=$('video').play();if(p&&p.catch)p.catch(function(){toast('Stream could not autoplay. Press Play in the player.')})}function loadUrl(url,name){toast('Loading playlist…');fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(text){var parsed=parseM3U(text);if(!parsed.length)throw new Error('No channels found in playlist');channels=parsed;savedUrl=url;savedName=name||'My Playlist';localStorage.setItem('jokerPlaylistUrl',url);localStorage.setItem('jokerPlaylistName',savedName);render();toast('Loaded '+channels.length+' channels')}).catch(function(e){toast('Playlist failed: '+e.message+' (CORS may block remote URLs)')})}
$('theme').onclick=function(){theme=theme==='dark'?'light':'dark';setTheme()};$('add').onclick=$('addTop').onclick=function(){showModal('addModal');$('playlistUrl').focus()};$('cancel').onclick=function(){hideModal('addModal')};$('save').onclick=function(){var u=$('playlistUrl').value.trim(),n=$('playlistName').value.trim();if(!u){toast('Enter a playlist URL');return}loadUrl(u,n);hideModal('addModal')};$('reload').onclick=function(){if(savedUrl)loadUrl(savedUrl,savedName);else showModal('addModal')};$('search').oninput=render;$('closeVideo').onclick=function(){ $('video').pause();$('video').removeAttribute('src');$('video').load();hideModal('videoModal')};document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){activeTab=t.getAttribute('data-tab');document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===t)});render()}});try{favorites=JSON.parse(localStorage.getItem('jokerFavorites')||'{}')}catch(e){favorites={}}if(savedUrl){loadUrl(savedUrl,savedName)}else render();if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}})();
</script></body></html>
